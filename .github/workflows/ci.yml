name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build needs a DATABASE_URL shape (site settings reads are
          # DB-failure-safe) and an auth secret; the DB is never contacted
          # during a build. Do NOT put real secrets here.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-only-placeholder-secret

      - name: Dependency audit (non-blocking)
        # Iranian network makes the audit endpoint flaky; report but don't gate
        run: npm audit --omit=dev || true
